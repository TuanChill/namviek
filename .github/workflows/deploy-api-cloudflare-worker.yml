name: Deploy API to Cloudflare Workers

on:
  push:
    branches:
      - v2/deploy-app-backend
    paths:
      - apps/api/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - .github/workflows/deploy-api-cloudflare-worker.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Worker bundle (with CJS banner patch)
        working-directory: apps/api
        run: pnpm build:worker

      - name: Upload Worker secrets
        working-directory: apps/api
        run: |
          echo "$ORIGINS"           | npx wrangler secret put ORIGINS           --env production
          echo "$DATABASE_URL"      | npx wrangler secret put DATABASE_URL      --env production
          echo "$R2_ACCOUNT_ID"     | npx wrangler secret put R2_ACCOUNT_ID     --env production
          echo "$R2_ACCESS_KEY_ID"  | npx wrangler secret put R2_ACCESS_KEY_ID  --env production
          echo "$R2_SECRET_ACCESS_KEY" | npx wrangler secret put R2_SECRET_ACCESS_KEY --env production
          echo "$R2_BUCKET"         | npx wrangler secret put R2_BUCKET         --env production
          echo "$R2_PUBLIC_URL"     | npx wrangler secret put R2_PUBLIC_URL     --env production
          echo "$MCP_API_KEY"       | npx wrangler secret put MCP_API_KEY       --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ORIGINS: ${{ secrets.ORIGINS }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          MCP_API_KEY: ${{ secrets.MCP_API_KEY }}

      - name: Deploy API Worker
        working-directory: apps/api
        run: npx wrangler deploy --env production --no-bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
